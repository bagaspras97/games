<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Gravity Hop</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0a24; overflow: hidden;
      font-family: system-ui, sans-serif; color: #fff; touch-action: none; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #score { position: fixed; top: 12px; left: 0; right: 0; text-align: center;
      font-size: 28px; font-weight: 800; pointer-events: none; }
    #platform { position: fixed; bottom: 6px; right: 10px; font-size: 11px; opacity: .4; }
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px;
      align-items: center; justify-content: center; background: rgba(13,10,36,.7); text-align: center; }
    .panel h1 { font-size: 56px; margin: 0; }
    .panel p { margin: 0; opacity: .8; }
    button { font: inherit; font-size: 22px; font-weight: 700; padding: 14px 36px; border: 0;
      border-radius: 999px; background: #ff4fa3; color: #fff; cursor: pointer; }
    button.alt { background: #4fffd2; color: #1b1446; }
    .hidden { display: none !important; }
    .panel h2 { font-size: 40px; margin: 0; }
    button.ghost { background: transparent; border: 2px solid #fff; }
    #shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px; width: min(720px, 92vw); max-height: 55vh; overflow-y: auto; padding: 4px; }
    .skin { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px;
      border-radius: 16px; background: #2a1f5c; font-size: 15px; border: 3px solid transparent; }
    .skin canvas { width: 72px; height: 72px; }
    .skin span { font-size: 13px; opacity: .85; }
    .skin.equipped { border-color: #4fffd2; }
    .skin.locked { opacity: .45; cursor: not-allowed; }
    #mute { position: fixed; top: 10px; right: 10px; z-index: 5; font-size: 22px; padding: 8px 12px;
      background: rgba(255,255,255,.12); }
    .fake-ad { position: fixed; inset: 0; background: #000; display: flex; align-items: center;
      justify-content: center; text-align: center; font-size: 22px; z-index: 10; }
    .fake-ad button { margin-top: 16px; font-size: 16px; padding: 8px 20px; }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="score"></div>
  <div id="platform"></div>
  <button id="mute" aria-label="Suara"></button>

  <div id="menu" class="panel">
    <h1>Gravity Hop</h1>
    <p>Tap / klik / spasi untuk membalik gravitasi. Hindari duri!</p>
    <button id="play">Main</button>
    <button class="open-shop ghost">🎨 Skin</button>
  </div>

  <div id="over" class="panel hidden">
    <h1>Game Over</h1>
    <p>Skor: <b id="final">0</b> &nbsp; Terbaik: <b id="best">0</b> &nbsp; 🪙 <b id="coins">0</b></p>
    <button id="revive" class="alt">▶ Lanjutkan (tonton iklan)</button>
    <button id="retry">Main lagi</button>
    <button class="open-shop ghost">🎨 Skin</button>
  </div>

  <div id="shop" class="panel hidden">
    <h2>Toko Skin</h2>
    <p>🪙 <b id="shop-coins">0</b></p>
    <div id="shop-grid"></div>
    <button id="free-coins" class="alt"></button>
    <button id="shop-close" class="ghost">Kembali</button>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
