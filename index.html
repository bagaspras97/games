<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Puffy: Deep Sea Adventure</title>
  <style>
    html, body { margin: 0; height: 100%; background: #04122a; overflow: hidden;
      font-family: system-ui, sans-serif; color: #fff; touch-action: none; user-select: none; }
    body { display: flex; align-items: center; justify-content: center; }
    canvas { display: block; }
    #score { position: fixed; top: 12px; left: 0; right: 0; text-align: center; font-size: 28px;
      font-weight: 800; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.5); }
    #platform { position: fixed; bottom: 6px; right: 10px; font-size: 11px; opacity: .4; }
    #mute { position: fixed; top: 10px; right: 10px; z-index: 5; font-size: 22px; padding: 8px 12px;
      background: rgba(255,255,255,.15); }
    #skill { position: fixed; right: 18px; bottom: 18px; z-index: 5; width: 104px; height: 104px; border-radius: 50%;
      padding: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      background: conic-gradient(#ffe27a calc(var(--p, 1) * 360deg), rgba(255,255,255,.15) 0);
      border: 4px solid rgba(255,255,255,.85); color: #1b1446; box-shadow: 0 0 18px rgba(255,226,122,.6); touch-action: none; }
    #skill:disabled { box-shadow: none; color: #fff; cursor: default; }
    #skill .sk-icon { font-size: 34px; line-height: 1; }
    #skill .sk-name { font-size: 11px; font-weight: 800; line-height: 1.1; max-width: 88px; }
    #skill .sk-cd { font-size: 22px; font-weight: 900; }
    .char-card .skill { font-size: 12px; line-height: 1.35; margin: 0; color: #9ff0ff; }
    #pause { position: fixed; top: 10px; right: 76px; z-index: 5; width: 50px; height: 42px; padding: 0;
      display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,.15); }
    #pause.hidden { display: none !important; }
    .pause-bars { width: 16px; height: 18px; box-sizing: border-box; border-left: 5px solid #fff; border-right: 5px solid #fff; }
    #swap { position: fixed; top: 10px; left: 10px; z-index: 5; font-size: 18px; padding: 8px 14px;
      background: rgba(255,255,255,.18); }
    #swap:disabled { opacity: .55; cursor: default; }
    #swap-panel .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    #rotate { position: fixed; inset: 0; z-index: 20; background: #04122a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 24px; font-size: 20px; font-weight: 700; }
    #rotate div { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
    #hint { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); width: min(620px, 86vw);
      background: rgba(4,18,42,.85); border: 2px solid #7ff0ff; border-radius: 16px; padding: 10px 16px;
      font-size: 20px; text-align: center; pointer-events: none; z-index: 4; box-sizing: border-box;
      animation: hintbob 1.4s ease-in-out infinite; }
    @keyframes hintbob { 50% { transform: translate(-50%, 6px); } }
    .settings-list { display: flex; flex-direction: column; gap: 8px; width: min(420px, 90vw); }
    .settings-list button { width: 100%; }
    .settings-list button.off { background: rgba(255,255,255,.18); color: #fff; }
    button.danger { border-color: #ff6b81; color: #ffb3bf; }
    #banner { position: fixed; top: 22%; left: 0; right: 0; text-align: center; font-size: 40px;
      font-weight: 900; pointer-events: none; text-shadow: 0 3px 12px rgba(0,0,0,.6); }
    #banner.pop { animation: pop 2.4s ease forwards; }
    @keyframes pop { 0% { opacity: 0; transform: scale(.7); } 12% { opacity: 1; transform: scale(1.05); }
      20% { transform: scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
    #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); width: min(560px, 90vw);
      background: rgba(4,18,42,.85); border: 2px solid #fff6a8; border-radius: 16px; padding: 12px 16px;
      font-size: 16px; line-height: 1.4; text-align: center; pointer-events: none; box-sizing: border-box; }
    .panel { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
      align-items: center; justify-content: center; background: rgba(4,18,42,.6); text-align: center;
      padding: 16px; box-sizing: border-box; }
    .panel h1 { font-size: 52px; margin: 0; line-height: 1.05; }
    .panel h1 small { display: block; font-size: 22px; font-weight: 600; opacity: .85; }
    .panel h2 { font-size: 36px; margin: 0; }
    .panel p { margin: 0; opacity: .9; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    button { font: inherit; font-size: 20px; font-weight: 700; padding: 12px 30px; border: 0;
      border-radius: 999px; background: #ff7a9c; color: #fff; cursor: pointer; }
    button.alt { background: #7ff0ff; color: #04122a; }
    button.ghost { background: transparent; border: 2px solid #fff; font-size: 17px; padding: 10px 22px; }
    .hidden { display: none !important; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px;
      width: min(760px, 92vw); max-height: 58vh; overflow-y: auto; padding: 4px; }
    .card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px;
      border-radius: 16px; background: rgba(20,60,110,.85); font-size: 15px; border: 3px solid transparent; }
    .card canvas { width: 72px; height: 72px; }
    .card span { font-size: 13px; opacity: .85; font-weight: 500; }
    .card.equipped { border-color: #7ff0ff; }
    .card.locked { opacity: .45; cursor: not-allowed; }
    #shop .grid { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
    .char-card canvas { width: 96px; height: 96px; }
    .char-card b small { display: block; font-size: 12px; font-weight: 500; opacity: .75; }
    .char-card .desc { font-size: 12px; font-weight: 500; line-height: 1.35; margin: 0; min-height: 3em; opacity: .9; }
    .char-card .ability { font-size: 12px; font-weight: 600; line-height: 1.35; margin: 0; color: #ffe27a; }
    .char-card.secret { background: linear-gradient(160deg, rgba(30,80,150,.9), rgba(60,30,110,.9)); border-color: #ffe27a; }
    .cause { font-size: 18px; font-style: italic; color: #ffd1dc; }
    #streak { width: min(620px, 92vw); background: linear-gradient(135deg, rgba(255,122,60,.35), rgba(255,60,120,.3));
      border: 2px solid #ffb35c; border-radius: 16px; padding: 10px 14px; box-sizing: border-box; }
    .s-head { font-size: 20px; font-weight: 800; }
    .s-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin: 8px 0; }
    .s-day { background: rgba(0,0,0,.3); border-radius: 10px; padding: 6px 2px; font-size: 11px; display: flex;
      flex-direction: column; align-items: center; gap: 2px; border: 2px solid transparent; }
    .s-day b { font-size: 12px; }
    .s-day.done { background: #ff8a3c; }
    .s-day.today { border-color: #ffe27a; animation: glow 1.2s ease-in-out infinite alternate; }
    @keyframes glow { to { box-shadow: 0 0 14px rgba(255,226,122,.8); } }
    .s-status { font-size: 13px; opacity: .9; }
    .s-actions { display: flex; gap: 8px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
    #missions-list { max-height: 34vh; overflow-y: auto; }
    #missions { gap: 10px; }
    #missions-list { display: flex; flex-direction: column; gap: 12px; width: min(620px, 92vw); }
    .mission { background: rgba(20,60,110,.85); border-radius: 16px; padding: 12px 16px; text-align: left;
      border: 2px solid transparent; }
    .mission.ready { border-color: #ffe27a; box-shadow: 0 0 18px rgba(255,226,122,.35); }
    .mission.claimed { opacity: .6; }
    .m-text { font-size: 16px; font-weight: 700; }
    .m-bar { position: relative; height: 18px; background: rgba(0,0,0,.35); border-radius: 9px; margin: 8px 0; overflow: hidden; }
    .m-bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #7ff0ff, #ff7a9c); border-radius: 9px; }
    .m-bar span { position: relative; display: block; text-align: center; font-size: 12px; font-weight: 700; line-height: 18px; }
    .m-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
    button.small { font-size: 15px; padding: 8px 16px; }
    .m-reward { opacity: .85; }
    .open-missions { position: relative; }
    .open-missions.has-badge::after { content: attr(data-badge); position: absolute; top: -6px; right: -6px;
      background: #ff3b5c; color: #fff; font-size: 12px; min-width: 20px; height: 20px; line-height: 20px;
      border-radius: 10px; padding: 0 4px; box-sizing: border-box; }
    #progress { position: fixed; top: 52px; left: 50%; transform: translateX(-50%); width: min(420px, 60vw); height: 10px;
      background: rgba(0,0,0,.35); border-radius: 5px; pointer-events: none; }
    #progress i { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #7ff0ff, #ffe27a); border-radius: 5px; }
    #progress span { position: absolute; right: -24px; top: -7px; font-size: 16px; }
    #levels-grid { display: flex; flex-direction: column; gap: 10px; width: min(640px, 92vw); max-height: 56vh; overflow-y: auto; }
    .lv-zone { background: rgba(20,60,110,.75); border-radius: 14px; padding: 8px 12px; }
    .lv-zone-name { font-weight: 800; text-align: left; margin-bottom: 6px; }
    .lv-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    .lv { padding: 8px 0; border-radius: 12px; display: flex; flex-direction: column; align-items: center; font-size: 20px;
      background: #2a7fc2; }
    .lv span { font-size: 13px; color: #ffe27a; letter-spacing: 1px; }
    .lv.cleared { background: #1f9e7a; }
    .lv.exam { background: #b8507a; }
    .lv.exam.cleared { background: #8a3f9e; }
    .lv.locked { background: rgba(255,255,255,.12); color: rgba(255,255,255,.6); cursor: not-allowed; }
    #done-stars { font-size: 64px; letter-spacing: 8px; }
    #done-stars .star { color: rgba(255,255,255,.2); display: inline-block; }
    #done-stars .star.on { color: #ffe27a; text-shadow: 0 0 18px rgba(255,226,122,.8); animation: starpop .5s ease both; }
    @keyframes starpop { 0% { transform: scale(0) rotate(-90deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
    #done-info { font-size: 16px; line-height: 1.6; }
    .done-reward { font-weight: 800; color: #ffe27a; margin-top: 4px; }
    .reward { font-size: 15px; color: #ffe27a; }
    .char-card .price { font-size: 14px; font-weight: 700; opacity: 1; }
    /* Keyboard hints on the in-game buttons; only shown where a keyboard + mouse is likely. */
    .keyhint::after { content: attr(data-key); display: none; position: absolute; bottom: -9px; right: -7px;
      min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 6px;
      background: #04122a; color: #fff; border: 1.5px solid rgba(255,255,255,.8); box-shadow: 0 2px 0 rgba(255,255,255,.3);
      font: 800 12px/17px system-ui, sans-serif; text-align: center; pointer-events: none; }
    #skill.keyhint::after { bottom: 0; right: 0; }
    @media (hover: hover) and (pointer: fine) { .keyhint::after { display: block; } }
    /* ---------- Game over ---------- */
    #over { gap: 12px; }
    #over-hero { width: 120px; height: 100px; margin-bottom: -10px; }
    .over-title { font-size: 66px !important; font-weight: 900; letter-spacing: -1px;
      background: linear-gradient(180deg, #ffffff 15%, #ffd3df 55%, #ff7a9c 95%); -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-stroke: 3px #0b3a6e; paint-order: stroke fill; filter: drop-shadow(0 5px 0 rgba(4,18,42,.55)); }
    .over-cause { background: rgba(4,18,42,.6); border: 1px solid rgba(255,209,220,.35); border-radius: 999px;
      padding: 5px 16px; font-style: italic; font-weight: 600; color: #ffd1dc; opacity: 1 !important; }
    .over-stats { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .ostat { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 118px; padding: 8px 18px;
      background: rgba(4,18,42,.6); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; }
    .ostat .ol { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; opacity: .75; }
    .ostat b { font-size: 24px; font-variant-numeric: tabular-nums; }
    .ostat.main { border-color: rgba(127,240,255,.6); }
    .ostat.main b { font-size: 34px; color: #7ff0ff; }
    .newbest { position: absolute; top: -12px; right: -14px; transform: rotate(8deg); background: #ffe27a; color: #04122a;
      font-style: normal; font-size: 11px; font-weight: 900; letter-spacing: .06em; border-radius: 999px; padding: 3px 9px;
      box-shadow: 0 0 14px rgba(255,226,122,.7); animation: bestpulse 1s ease-in-out infinite alternate; }
    @keyframes bestpulse { to { transform: rotate(8deg) scale(1.1); } }
    .over-level { width: min(460px, 90vw); background: rgba(4,18,42,.6); border: 1px solid rgba(255,255,255,.18);
      border-radius: 16px; padding: 8px 16px 12px; font-weight: 700; }
    .over-bar { height: 10px; margin-top: 8px; border-radius: 5px; background: rgba(0,0,0,.35); overflow: hidden; }
    .over-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7ff0ff, #ffe27a); border-radius: 5px; }
    .over-actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .over-actions .mode-card { width: 270px; }
    @media (prefers-reduced-motion: reduce) { .newbest { animation: none; } }
    /* ---------- Main menu ---------- */
    #menu { gap: 14px; }
    .logo { display: flex; align-items: center; gap: 4px; margin-bottom: -4px; }
    #logo-hero { width: 120px; height: 120px; }
    .wordmark { display: flex; flex-direction: column; align-items: flex-start; }
    .logo-title { font-size: 84px; font-weight: 900; line-height: .9; letter-spacing: -1px;
      background: linear-gradient(180deg, #fff6b0 10%, #ffc94a 55%, #ff8f3a 95%); -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-stroke: 3px #0b3a6e; paint-order: stroke fill;
      filter: drop-shadow(0 5px 0 rgba(4,18,42,.55)); }
    .logo-sub { font-size: 15px; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; color: #bff6ff;
      margin-top: 6px; padding-left: 4px; }
    .menu-stats { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
    .stat { display: flex; align-items: center; gap: 6px; background: rgba(4,18,42,.55); border: 1px solid rgba(255,255,255,.18);
      border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 15px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .stat i { font-style: normal; font-size: 16px; }
    .stat .st { color: #ffe27a; }
    .modes { display: flex; gap: 14px; align-items: stretch; flex-wrap: wrap; justify-content: center; }
    .mode-col { display: flex; flex-direction: column; gap: 8px; }
    .mode-card { display: flex; align-items: center; gap: 14px; text-align: left; width: 300px; padding: 14px 20px;
      border-radius: 22px; box-shadow: 0 6px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.35);
      transition: transform .12s ease; }
    .mode-card:hover { transform: translateY(-2px); }
    .mode-card:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.28), inset 0 2px 0 rgba(255,255,255,.35); }
    .mode-card.adv { background: linear-gradient(160deg, #ff9ab5, #ff5f86); }
    .mode-card.free { background: linear-gradient(160deg, #9ff8ff, #38c9e6); color: #04223f; }
    .mode-icon { font-size: 40px; line-height: 1; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
    .mode-text { display: flex; flex-direction: column; gap: 2px; }
    .mode-name { font-size: 25px; font-weight: 900; }
    .mode-sub { font-size: 13px; font-weight: 700; opacity: .85; }
    .mode-col .shield-start { align-self: stretch; }
    .tiles { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; width: 108px;
      padding: 10px 6px 8px; border-radius: 18px; font-size: 13px; background: rgba(4,18,42,.55);
      border: 2px solid rgba(255,255,255,.22); }
    .tile:hover { border-color: #7ff0ff; }
    .tile-icon { font-size: 28px; line-height: 1.1; }
    .tile.gold { border-color: #ffe27a; box-shadow: 0 0 16px rgba(255,226,122,.45); }
    .tile.open-missions.has-badge::after { top: -7px; right: -7px; }
    .menu-intro { font-size: 13px; opacity: .7 !important; max-width: 560px; }
    /* ---------- Encyclopedia ---------- */
    #dex .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); width: min(920px, 94vw); max-height: 65vh; }
    .dex-progress { width: min(320px, 70vw); height: 8px; border-radius: 4px; background: rgba(0,0,0,.35); overflow: hidden; }
    .dex-progress i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7ff0ff, #ffe27a); border-radius: 4px; }
    .dex-card { position: relative; gap: 4px; padding: 8px 10px 12px; border: 2px solid rgba(255,255,255,.14); min-width: 0; }
    .dex-card.zone-0 { background: radial-gradient(circle at 50% 38%, rgba(255,255,255,.28), transparent 55%), linear-gradient(170deg, #34aee0, #13639a); }
    .dex-card.zone-1 { background: radial-gradient(circle at 50% 38%, rgba(160,220,255,.25), transparent 55%), linear-gradient(170deg, #2a74c8, #123a78); }
    .dex-card.zone-2 { background: radial-gradient(circle at 50% 38%, rgba(200,170,255,.22), transparent 55%), linear-gradient(170deg, #6c52b8, #281f62); }
    .dex-card.zone-3 { background: radial-gradient(circle at 50% 38%, rgba(110,230,255,.18), transparent 55%), linear-gradient(170deg, #1d2454, #060918);
      border-color: rgba(120,230,255,.3); }
    .dex-card.found { border-color: rgba(255,226,122,.6); }
    .dex-head { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 11px; font-weight: 800; }
    .dex-head { gap: 6px; }
    .dex-no { letter-spacing: .08em; opacity: .75; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .dex-zone { background: rgba(0,0,0,.28); border-radius: 999px; padding: 2px 8px; font-weight: 700; white-space: nowrap;
      min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .card.dex-card canvas { width: 126px; height: 84px; max-width: 100%; }
    .dex-card > * { flex-shrink: 0; }
    .dex-card b { font-size: 16px; }
    .dex-card.unknown b { letter-spacing: .25em; opacity: .7; }
    .dex-card span.fact { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.3; }
    #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }
    #confetti.hidden { display: none; }
    #finale > p { max-width: min(640px, 92vw); }
    #finale-chars { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
    #finale-chars canvas { width: 88px; height: 88px; }
    #finale-stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    #finale-stats .chip { background: rgba(255,255,255,.12); border-radius: 12px; padding: 6px 12px; min-width: 96px; text-align: center; }
    #finale-stats .chip b { display: block; font-size: 22px; }
    #finale-stats .chip span { font-size: 12px; opacity: .85; }
    .finale-thanks { font-size: 15px; opacity: .9; }
    .dex-card span { font-size: 12px; line-height: 1.35; }
    .dex-card.unknown { opacity: .6; }
    .dex-card .q { font-size: 44px; height: 72px; display: flex; align-items: center; }
    .fake-ad { position: fixed; inset: 0; background: #000; display: flex; align-items: center;
      justify-content: center; text-align: center; font-size: 22px; z-index: 10; }
    .fake-ad button { margin-top: 16px; font-size: 16px; padding: 8px 20px; }
    /* Compact layout for short screens (phones held sideways) */
    @media (max-height: 520px) {
      .panel { gap: 6px; padding: 8px; justify-content: flex-start; overflow-y: auto; }
      .panel > * { flex-shrink: 0; }   /* scroll the panel instead of squashing its content */
      .panel h1 { font-size: 30px; }
      .panel h1 small { font-size: 15px; }
      .panel h2 { font-size: 22px; }
      .panel p { font-size: 13px; }
      button { font-size: 15px; padding: 8px 18px; }
      button.ghost { font-size: 13px; padding: 6px 14px; }
      button.small { font-size: 12px; padding: 5px 10px; }
      .grid { max-height: none; gap: 8px; }
      #shop .grid, #swap-panel .grid { display: flex; overflow-x: auto; overflow-y: hidden; width: 94vw; padding-bottom: 4px; }
      #shop .grid, #swap-panel .grid { align-items: stretch; }
      #shop .char-card, #swap-panel .char-card { flex: 0 0 172px; padding: 6px; height: auto; }
      #shop .char-card .desc { display: none; }   /* keep ability + skill; the card stays readable */
      .char-card canvas { width: 56px; height: 56px; }
      .char-card .desc, .char-card .ability, .char-card .skill { font-size: 10px; line-height: 1.25; min-height: 0; }
      #dex .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); max-height: 60vh; }
      .card.dex-card canvas { width: 96px; height: 64px; }
      .dex-card span.fact { -webkit-line-clamp: 3; font-size: 11px; }
      .dex-card b { font-size: 13px; }
      .dex-card { padding: 6px 6px 8px; }
      .dex-head { font-size: 10px; }
      .dex-zone { padding: 1px 6px; }
      #menu { gap: 6px; }
      #logo-hero { width: 62px; height: 62px; }
      .logo-title { font-size: 46px; -webkit-text-stroke-width: 2px; }
      .logo-sub { font-size: 10px; margin-top: 2px; }
      .stat { font-size: 12px; padding: 2px 10px 2px 6px; }
      .mode-card { width: 230px; padding: 7px 14px; gap: 10px; border-radius: 16px; }
      .mode-icon { font-size: 26px; }
      .mode-name { font-size: 18px; }
      .mode-sub { font-size: 11px; }
      .mode-col { gap: 4px; }
      .mode-col .shield-start { font-size: 12px; padding: 3px 10px; }
      .tile { width: 86px; padding: 4px 4px 3px; font-size: 11px; border-radius: 12px; }
      .tile-icon { font-size: 18px; }
      .menu-intro { display: none; }
      #over-hero { display: none; }
      .over-title { font-size: 34px !important; -webkit-text-stroke-width: 2px; }
      .over-cause { font-size: 13px; padding: 2px 12px; }
      .ostat { min-width: 86px; padding: 2px 10px; border-radius: 12px; }
      .ostat .ol { font-size: 9px; }
      .ostat b { font-size: 16px; }
      .ostat.main b { font-size: 20px; }
      .newbest { top: -9px; right: -10px; font-size: 9px; padding: 1px 6px; }
      .over-level { padding: 4px 12px 6px; font-size: 13px; }
      .over-bar { height: 6px; margin-top: 4px; }
      .over-actions { gap: 8px; }
      .over-actions .mode-card { width: 210px; }
      #finale-chars canvas { width: 52px; height: 52px; }
      #finale-stats .chip { padding: 3px 8px; min-width: 70px; }
      #finale-stats .chip b { font-size: 16px; }
      .finale-thanks { display: none; }
      .dex-card canvas { width: 52px; height: 52px; }
      #missions-list { max-height: none; }
      #streak { padding: 6px 10px; }
      .s-row { gap: 4px; margin: 4px 0; }
      .lv { padding: 4px 0; font-size: 16px; }
      #levels-grid { max-height: none; }
      #done-stars { font-size: 44px; }
      #score { font-size: 20px; top: 6px; }
      #toast { font-size: 13px; bottom: 8px; padding: 8px 12px; }
      #banner { font-size: 28px; }
      #hint { top: 40px; font-size: 15px; padding: 6px 12px; }
      #skill { width: 80px; height: 80px; right: 12px; bottom: 12px; }
      #skill .sk-icon { font-size: 26px; }
      #skill .sk-name { font-size: 9px; }
      #mute, #pause, #swap { font-size: 15px; padding: 5px 10px; }
      #pause { right: 60px; }
    }
  </style>
</head>
<body>
  <canvas id="game" width="1280" height="720"></canvas>
  <canvas id="confetti" class="hidden"></canvas>
  <div id="score"></div>
  <div id="platform"></div>
  <div id="banner" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="toast" class="hidden"></div>
  <button id="mute" data-i18n-aria="sound"></button>
  <div id="rotate" class="hidden"><div>📱↻</div><p data-i18n="rotate"></p></div>
  <button id="pause" class="hidden keyhint" data-key="P" data-i18n-aria="pause"><span class="pause-bars"></span></button>
  <div id="pause-panel" class="panel hidden">
    <h2 data-i18n="paused"></h2>
    <p data-i18n="pausedSub"></p>
    <button id="pause-resume" data-i18n="resume"></button>
    <button class="open-settings ghost" data-i18n="settings"></button>
    <button id="pause-quit" class="ghost" data-i18n="mainMenu"></button>
  </div>
  <button id="skill" class="hidden keyhint" data-key="X" aria-label="Skill"></button>
  <button id="swap" class="hidden keyhint" data-key="C" data-i18n-aria="swapTitle"></button>

  <div id="swap-panel" class="panel hidden">
    <h2 data-i18n="swapTitle"></h2>
    <p data-i18n="swapSub"></p>
    <div id="swap-grid" class="grid"></div>
    <button id="swap-close" class="ghost" data-i18n="swapClose"></button>
  </div>

  <div id="menu" class="panel">
    <div class="logo">
      <canvas id="logo-hero" width="180" height="180"></canvas>
      <div class="wordmark"><span class="logo-title">Puffy</span><span class="logo-sub" data-i18n="subtitle"></span></div>
    </div>
    <div id="menu-stats" class="menu-stats"></div>
    <div class="modes">
      <button class="open-levels mode-card adv"><span class="mode-icon">🗺️</span><span class="mode-text"><span class="mode-name" data-i18n="modeAdventure"></span><span class="mode-sub" id="menu-adv-sub"></span></span></button>
      <div class="mode-col">
        <button id="play" class="mode-card free"><span class="mode-icon">🌊</span><span class="mode-text"><span class="mode-name" data-i18n="modeFree"></span><span class="mode-sub" id="menu-free-sub"></span></span></button>
        <button class="shield-start ghost small" data-i18n="freeShield"></button>
      </div>
    </div>
    <div class="tiles">
      <button class="open-shop tile"><span class="tile-icon">🐠</span><span data-i18n="tileChars"></span></button>
      <button class="open-dex tile"><span class="tile-icon">📖</span><span data-i18n="tileDex"></span></button>
      <button class="open-missions tile"><span class="tile-icon">🎯</span><span data-i18n="tileMissions"></span></button>
      <button class="open-settings tile"><span class="tile-icon">⚙️</span><span data-i18n="tileSettings"></span></button>
      <button id="menu-finale" class="open-finale tile gold hidden"><span class="tile-icon">🏆</span><span data-i18n="tileFinale"></span></button>
    </div>
    <p class="menu-intro" data-i18n="intro"></p>
  </div>

  <div id="over" class="panel hidden">
    <canvas id="over-hero" width="180" height="150"></canvas>
    <h1 id="over-title" class="over-title">Oops!</h1>
    <p id="over-cause" class="over-cause"></p>
    <div id="over-stats" class="over-stats">
      <div class="ostat main"><span class="ol" data-i18n="statDepth"></span><b><span id="final">0</span> m</b><em id="over-newbest" class="newbest hidden" data-i18n="newBest"></em></div>
      <div class="ostat"><span class="ol" data-i18n="statBest"></span><b><span id="best">0</span> m</b></div>
      <div class="ostat"><span class="ol" data-i18n="statPearls"></span><b>🦪 <span id="pearls">0</span></b></div>
    </div>
    <div id="over-level" class="over-level hidden"><div id="over-level-text"></div><div class="over-bar"><i id="over-level-bar"></i></div></div>
    <div class="over-actions">
      <button id="revive" class="mode-card free"><span class="mode-icon">▶️</span><span class="mode-text"><span class="mode-name" data-i18n="reviveName"></span><span class="mode-sub" data-i18n="reviveSub"></span></span></button>
      <button id="retry" class="mode-card adv"><span class="mode-icon">🔄</span><span class="mode-text"><span class="mode-name" data-i18n="retryName"></span><span class="mode-sub" id="retry-sub"></span></span></button>
    </div>
    <button class="shield-start ghost small" data-i18n="retryShield"></button>
    <div class="tiles">
      <button id="over-home" class="tile"><span class="tile-icon">🏠</span><span data-i18n="tileHome"></span></button>
      <button id="over-map" class="tile hidden"><span class="tile-icon">🗺️</span><span data-i18n="tileMap"></span></button>
      <button class="open-shop tile"><span class="tile-icon">🐠</span><span data-i18n="tileChars"></span></button>
      <button class="open-dex tile"><span class="tile-icon">📖</span><span data-i18n="tileDex"></span></button>
      <button class="open-missions tile"><span class="tile-icon">🎯</span><span data-i18n="tileMissions"></span></button>
    </div>
  </div>

  <div id="shop" class="panel hidden">
    <h2 data-i18n="shopTitle"></h2>
    <p data-i18n="shopSub"></p>
    <p>🦪 <b id="shop-pearls">0</b></p>
    <div id="shop-grid" class="grid"></div>
    <button id="free-pearls" class="alt"></button>
    <button id="shop-close" class="ghost" data-i18n="back"></button>
  </div>

  <div id="progress" class="hidden"><i id="progress-fill"></i><span>🏁</span></div>

  <div id="levels" class="panel hidden">
    <h2 data-i18n="levelsTitle"></h2>
    <p><span data-i18n="starsLbl"></span> ★ <b id="levels-stars">0</b> &nbsp;·&nbsp; <span data-i18n="levelsRules"></span></p>
    <p class="cause" data-i18n="levelsPearls"></p>
    <div id="levels-grid"></div>
    <button id="levels-close" class="ghost" data-i18n="back"></button>
  </div>

  <div id="finale" class="panel hidden">
    <h1 data-i18n="finaleTitle"></h1>
    <p data-i18n="finaleSub"></p>
    <div id="finale-chars"></div>
    <div id="finale-stats"></div>
    <p id="finale-note" class="cause"></p>
    <p class="finale-thanks" data-i18n="finaleThanks"></p>
    <button id="finale-close" data-i18n="finaleKeep"></button>
  </div>

  <div id="level-done" class="panel hidden">
    <h1 id="done-title" data-i18n="levelDoneTitle"></h1>
    <p id="done-name" class="cause"></p>
    <div id="done-stars"></div>
    <div id="done-info"></div>
    <button id="done-next" data-i18n="doneNext"></button>
    <div class="row">
      <button id="done-retry" class="ghost" data-i18n="doneRetry"></button>
      <button id="done-map" class="ghost" data-i18n="doneMap"></button>
    </div>
  </div>

  <div id="settings" class="panel hidden">
    <h2 data-i18n="settings"></h2>
    <div class="settings-list">
      <button id="set-music" class="alt"></button>
      <button id="set-sfx" class="alt"></button>
      <button id="set-vibrate" class="alt"></button>
      <button id="set-gfx" class="alt"></button>
      <p class="cause" data-i18n="gfxHint"></p>
      <button id="set-reset" class="ghost danger"></button>
    </div>
    <button id="settings-close" class="ghost" data-i18n="back"></button>
  </div>

  <div id="missions" class="panel hidden">
    <h2 data-i18n="missionsTitle"></h2>
    <p data-i18n="missionsSub"></p>
    <div id="streak"></div>
    <div id="missions-list"></div>
    <button id="missions-close" class="ghost" data-i18n="back"></button>
  </div>

  <div id="dex" class="panel hidden">
    <h2 data-i18n="dexTitle"></h2>
    <p><span data-i18n="dexSub"></span> <b id="dex-count">0</b></p>
    <div class="dex-progress"><i id="dex-bar"></i></div>
    <div id="dex-grid" class="grid"></div>
    <p id="dex-reward" class="reward"></p>
    <button id="dex-close" class="ghost" data-i18n="back"></button>
  </div>

  <script type="module" src="src/game.js"></script>
</body>
</html>
