<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Puffy cover generator</title>
  <style>
    body { margin: 0; background: #222; color: #fff; font-family: system-ui, sans-serif; }
    canvas { display: block; margin: 12px; box-shadow: 0 0 0 1px #555; }
  </style>
</head>
<body>
  <!-- Dev tool (not shipped): renders the store covers from the game's own art.
       Open via a local server: http://localhost:8000/tools/covers.html -->
  <canvas id="landscape" width="1920" height="1080"></canvas>
  <canvas id="portrait" width="800" height="1200"></canvas>
  <canvas id="square" width="800" height="800"></canvas>
  <canvas id="icon" width="512" height="512"></canvas>
  <script type="module">
    import { CHARACTERS } from "../src/characters.js";
    import { MOMENTS } from "../src/moments.js";
    import { makeFloorDeco, drawFloorDeco } from "../src/decor.js";

    const ch = (id) => CHARACTERS.find((c) => c.id === id);
    const TAU = Math.PI * 2;
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

    function sea(ctx, w, h) {
      const g = ctx.createLinearGradient(0, 0, 0, h);
      g.addColorStop(0, "#7fd8ff"); g.addColorStop(0.45, "#2a95d6"); g.addColorStop(1, "#0b4f8f");
      ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
      ctx.fillStyle = "rgba(255,255,255,0.13)";               // sun rays
      for (let i = 0; i < 6; i++) {
        const x = (i / 6) * w * 1.3 - w * 0.1;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w * 0.08, 0); ctx.lineTo(x - w * 0.12, h); ctx.lineTo(x - w * 0.24, h); ctx.fill();
      }
    }

    function seabed(ctx, w, h, groundY) {
      ctx.fillStyle = "rgba(10,60,110,0.45)";                  // far reef
      ctx.beginPath(); ctx.moveTo(0, h);
      for (let x = 0; x <= w; x += 20) ctx.lineTo(x, groundY - 70 - Math.sin(x * 0.008) * 40 - Math.abs(Math.sin(x * 0.05)) * 14);
      ctx.lineTo(w, h); ctx.fill();
      const g = ctx.createLinearGradient(0, groundY, 0, h);
      g.addColorStop(0, "#f0d494"); g.addColorStop(1, "#b88d50");
      ctx.fillStyle = g; ctx.fillRect(0, groundY, w, h - groundY);
      const deco = makeFloorDeco(0, w);
      for (const d of deco) { d.h *= 1.5; drawFloorDeco(ctx, d.dx, groundY, d, 1.3, 0, -999, -999, 0); }
    }

    function bubbles(ctx, w, h, n) {
      ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 2;
      for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.arc(rnd() * w, rnd() * h * 0.85, 3 + rnd() * 12, 0, TAU); ctx.stroke(); }
    }

    function sprite(ctx, id, x, y, scale, opts = {}) {
      ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale); if (opts.rot) ctx.rotate(opts.rot);
      ch(id).draw(ctx, { t: opts.t ?? 0.6, up: opts.up ?? true, vy: opts.vy ?? 0, mood: opts.mood ?? "happy", pulse: 0.3, flash: 0, near: opts.near ?? 0 });
      ctx.restore();
    }

    function pearl(ctx, x, y, r) {
      ctx.fillStyle = "#fff4fb"; ctx.shadowColor = "#fff"; ctx.shadowBlur = r;
      ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.shadowBlur = 0;
      ctx.fillStyle = "#f2c9e4"; ctx.beginPath(); ctx.arc(x + r * 0.25, y + r * 0.25, r * 0.6, 0, TAU); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.35, r * 0.25, 0, TAU); ctx.fill();
    }

    function title(ctx, x, y, size) {
      ctx.save();
      ctx.font = `900 ${size}px "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.lineJoin = "round";
      ctx.lineWidth = size * 0.16; ctx.strokeStyle = "#0b3a6e"; ctx.strokeText("Puffy", x, y);
      const g = ctx.createLinearGradient(0, y - size / 2, 0, y + size / 2);
      g.addColorStop(0, "#fff3a6"); g.addColorStop(1, "#ffb340");
      ctx.fillStyle = g; ctx.fillText("Puffy", x, y);
      ctx.restore();
    }

    function whale(ctx, w, h, k, scale) {
      ctx.save(); ctx.globalAlpha = 0.55;
      ctx.scale(scale, scale);
      MOMENTS.humpback.draw(ctx, k, 1.1, w / scale, h / scale, { seed: 0.3 });
      ctx.restore();
    }

    function cover(id, layout) {
      const c = document.getElementById(id), ctx = c.getContext("2d"), w = c.width, h = c.height;
      seed = 7;
      sea(ctx, w, h);
      layout(ctx, w, h);
    }

    cover("landscape", (ctx, w, h) => {
      whale(ctx, w, h, 0.55, 1.4);
      seabed(ctx, w, h, h * 0.86);
      bubbles(ctx, w, h, 26);
      [[0.62, 0.42], [0.67, 0.37], [0.72, 0.34], [0.77, 0.34], [0.82, 0.37]].forEach(([x, y]) => pearl(ctx, w * x, h * y, 22));
      sprite(ctx, "kudi", w * 0.17, h * 0.58, 3.2, { up: false });
      sprite(ctx, "jeli", w * 0.83, h * 0.62, 2.8);
      sprite(ctx, "okto", w * 0.28, h * 0.78, 2.6, { up: false, mood: "normal" });
      sprite(ctx, "lumi", w * 0.72, h * 0.8, 2.6, { up: false, near: 0.8 });
      sprite(ctx, "puffy", w * 0.5, h * 0.58, 6.2);
      title(ctx, w * 0.5, h * 0.17, 210);
    });

    cover("portrait", (ctx, w, h) => {
      whale(ctx, w, h, 0.5, 0.95);
      seabed(ctx, w, h, h * 0.86);
      bubbles(ctx, w, h, 18);
      [[0.3, 0.62], [0.42, 0.66], [0.58, 0.66], [0.7, 0.62]].forEach(([x, y]) => pearl(ctx, w * x, h * y, 16));
      sprite(ctx, "kudi", w * 0.18, h * 0.76, 2.4, { up: false });
      sprite(ctx, "jeli", w * 0.82, h * 0.74, 2.2);
      sprite(ctx, "puffy", w * 0.5, h * 0.47, 5.2);
      title(ctx, w * 0.5, h * 0.15, 150);
    });

    cover("square", (ctx, w, h) => {
      whale(ctx, w, h, 0.5, 0.8);
      seabed(ctx, w, h, h * 0.84);
      bubbles(ctx, w, h, 14);
      sprite(ctx, "kudi", w * 0.15, h * 0.68, 2.2, { up: false });
      sprite(ctx, "jeli", w * 0.86, h * 0.66, 2);
      sprite(ctx, "puffy", w * 0.5, h * 0.56, 4.6);
      title(ctx, w * 0.5, h * 0.17, 140);
    });

    cover("icon", (ctx, w, h) => {
      bubbles(ctx, w, h, 10);
      sprite(ctx, "puffy", w * 0.54, h * 0.52, 5.2);
    });

    window.__ready = true;
  </script>
</body>
</html>
